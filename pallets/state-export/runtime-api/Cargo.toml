[package]
name = "state-export-runtime-api"
version = "0.0.1"
edition = "2021"
authors = ["Subtensor Team"]
description = "Runtime API for exporting chain state to JSON"
license = "MIT"
repository = "https://github.com/opentensor/subtensor"
publish = false

[dependencies]
codec = { package = "parity-scale-codec", version = "3.0.0", default-features = false, features = ["derive"] }
serde = { version = "1.0.132", default-features = false, features = ["derive"] }
sp-api = { git = "https://github.com/paritytech/substrate", branch = "polkadot-v1.0.0", default-features = false }
sp-std = { git = "https://github.com/paritytech/substrate", branch = "polkadot-v1.0.0", default-features = false }
sp-runtime = { git = "https://github.com/paritytech/substrate", branch = "polkadot-v1.0.0", default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "serde/std",
    "sp-api/std",
    "sp-std/std",
    "sp-runtime/std",
]